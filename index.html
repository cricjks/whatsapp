<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030303">
<meta name="description" content="JD Store">
<title>JD Store</title>

<style>
:root{
  --gold:#d9a83f;
  --gold2:#ffe39a;
  --black:#030303;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:#030303;
}
body{
  color:#fff;
  font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.045;
  background-image:
    linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at center,#000,transparent 80%);
}
.page{
  min-height:100svh;
  display:flex;
  justify-content:center;
  padding:18px 12px 28px;
  background:
    radial-gradient(ellipse at 50% 10%,rgba(201,148,45,.18),transparent 38%),
    radial-gradient(ellipse at 50% 80%,rgba(118,73,10,.12),transparent 45%),
    #030303;
}
.experience{
  width:min(100%,620px);
  display:flex;
  flex-direction:column;
  align-items:center;
}
.brand{
  margin:2px 0 10px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(43px,12vw,74px);
  line-height:.9;
  letter-spacing:.08em;
  font-weight:700;
  background:linear-gradient(180deg,#fff0b2,#e8bb58 42%,#966013);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.8));
}
.brand-line{
  width:min(70%,330px);
  height:1px;
  margin:0 auto 16px;
  background:linear-gradient(90deg,transparent,#d49a2e,#fff0a5,#d49a2e,transparent);
}
.hero-shell{
  position:relative;
  width:100%;
  padding:7px;
  border:1px solid rgba(224,179,77,.34);
  border-radius:27px;
  background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.02));
  box-shadow:
    0 35px 90px rgba(0,0,0,.72),
    0 0 55px rgba(181,123,24,.12),
    inset 0 1px 0 rgba(255,255,255,.12);
  overflow:hidden;
}
.hero{
  display:block;
  width:100%;
  height:auto;
  border-radius:20px;
}
.cta-area{
  position:relative;
  z-index:5;
  width:100%;
  margin-top:-7px;
  padding:0 9px;
}
.join{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:63px;
  border-radius:18px;
  border:1px solid rgba(255,230,160,.7);
  background:linear-gradient(180deg,#f5d77b,#d8a43b 50%,#a66d18);
  color:#080604;
  text-decoration:none;
  font-size:17px;
  font-weight:900;
  letter-spacing:.075em;
  box-shadow:
    0 16px 32px rgba(0,0,0,.55),
    0 0 28px rgba(221,171,67,.25),
    inset 0 1px 0 rgba(255,255,255,.75);
  overflow:hidden;
  cursor:pointer;
  transition:transform .18s ease,filter .18s ease;
}
.join:active{transform:scale(.985)}
.join:hover{filter:brightness(1.06)}
.wa{
  width:29px;
  height:29px;
  margin-right:11px;
  flex:none;
}
.join:after{
  content:"";
  position:absolute;
  top:0;
  left:-35%;
  width:24%;
  height:100%;
  transform:skewX(-20deg);
  background:rgba(255,255,255,.43);
  filter:blur(8px);
  animation:shine 4s infinite;
}
@keyframes shine{
  0%,55%{left:-35%}
  75%,100%{left:125%}
}

/* TikTok fallback */
.fallback{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
}
.fallback.show{display:flex}
.sheet{
  width:min(100%,520px);
  padding:12px;
  border:1px solid rgba(224,179,77,.38);
  border-radius:22px;
  background:linear-gradient(145deg,#17130c,#080808);
  box-shadow:0 25px 70px rgba(0,0,0,.75);
}
.sheet-title{
  padding:4px 8px 10px;
  text-align:center;
  color:#f2cd70;
  font-family:Georgia,serif;
  font-size:19px;
  font-weight:700;
}
.fallback-buttons{
  display:grid;
  gap:9px;
}
.fallback-buttons a,
.fallback-buttons button{
  width:100%;
  min-height:53px;
  border-radius:14px;
  border:1px solid rgba(255,226,150,.35);
  font-size:15px;
  font-weight:800;
  letter-spacing:.04em;
  cursor:pointer;
}
.open-browser{
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  background:linear-gradient(180deg,#f5d77b,#c98d21);
  color:#080604;
}
.copy-link{
  background:#151515;
  color:#f4d47c;
}
.close{
  background:transparent;
  border-color:transparent!important;
  color:#aaa;
  min-height:42px!important;
}

@media(max-width:480px){
  .page{padding:13px 9px 22px}
  .hero-shell{padding:6px;border-radius:22px}
  .hero{border-radius:17px}
  .cta-area{padding:0 6px}
  .join{min-height:60px;border-radius:16px;font-size:15px}
}

@media(prefers-reduced-motion:reduce){
  .join:after{animation:none}
}
</style>
</head>

<body>

<main class="page">
  <section class="experience" aria-label="JD Store">

    <div class="brand">JD STORE</div>
    <div class="brand-line"></div>

    <div class="hero-shell">
      <img class="hero" src="jd-store.png" alt="JD Store">
    </div>

    <div class="cta-area">

      <a id="joinButton"
         class="join"
         href="https://chat.whatsapp.com/GSBuXahlqJ21uJvYHimiun?s=cl&p=a&mlu=4"
         aria-label="Join JD Store WhatsApp group">

        <svg class="wa" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" fill="#101010"/>
          <path fill="#fff"
          d="M23.4 8.6A10.5 10.5 0 0 0 6 21.1L4.8 25.5l4.5-1.2A10.5 10.5 0 0 0 23.4 8.6Zm-7.4 16a8.7 8.7 0 0 1-4.4-1.2l-.3-.2-2.7.7.7-2.6-.2-.3a8.7 8.7 0 1 1 6.9 3.6Zm4.8-6.5c-.3-.2-1.7-.9-2-.9-.3-.1-.5-.2-.7.2-.2.3-.8.9-1 .9-.2.1-.4.1-.7-.1-.3-.2-1.1-.4-2-1.3-.7-.7-1.3-1.6-1.4-1.9-.1-.3 0-.5.2-.7l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.5-.1-.7-.1-.2-.7-1.7-.9-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.2 3.4 1.4 3.6c.2.2 2.3 3.5 5.5 4.8.8.3 1.4.5 1.9.6.8.3 1.5.2 2 .1.6-.1 1.7-.7 2-1.3.2-.6.2-1.1.1-1.3-.1-.1-.3-.2-.6-.4Z"/>
        </svg>

        <span id="joinText">JOIN WHATSAPP GROUP</span>

      </a>

    </div>
  </section>
</main>


<!-- TikTok fallback popup -->

<div id="fallback"
     class="fallback"
     role="dialog"
     aria-modal="true"
     aria-label="Open WhatsApp">

  <div class="sheet">

    <div class="sheet-title">
      OPEN JD STORE
    </div>

    <div class="fallback-buttons">

      <a id="chromeLink"
         class="open-browser"
         href="#">
        OPEN IN CHROME
      </a>

      <button id="copyButton"
              class="copy-link"
              type="button">
        COPY WHATSAPP LINK
      </button>

      <button id="closeButton"
              class="close"
              type="button">
        CLOSE
      </button>

    </div>

  </div>
</div>


<script>
(function(){

  const WA =
    "https://chat.whatsapp.com/GSBuXahlqJ21uJvYHimiun?s=cl&p=a&mlu=4";

  const join =
    document.getElementById("joinButton");

  const text =
    document.getElementById("joinText");

  const fallback =
    document.getElementById("fallback");

  const chromeLink =
    document.getElementById("chromeLink");

  const copyButton =
    document.getElementById("copyButton");

  const closeButton =
    document.getElementById("closeButton");


  const ua =
    navigator.userAgent || "";

  const isTikTok =
    /TikTok|musical_ly/i.test(ua);

  const isAndroid =
    /Android/i.test(ua);


  /*
    Android Chrome external-browser intent.
    This is only used after the user taps the button.
  */

  const chromeIntent =
    "intent://" +
    WA.replace(/^https?:\/\//i, "") +
    "#Intent;scheme=https;package=com.android.chrome;end";


  chromeLink.href =
    isAndroid ? chromeIntent : WA;


  function showFallback(){
    fallback.classList.add("show");
  }


  function attempt(){

    /*
      TikTok's in-app browser can block
      WhatsApp app handoff.

      Instead of showing:
      "Action can't be completed"

      we show an external-browser option.
    */

    if(isTikTok){
      showFallback();
      return;
    }


    /*
      Normal browsers:
      send the visitor directly to WhatsApp.
    */

    window.location.href = WA;


    /*
      If the browser blocks the handoff,
      show the fallback.
    */

    setTimeout(
      showFallback,
      1800
    );
  }


  join.addEventListener(
    "click",
    function(e){

      e.preventDefault();

      attempt();

    }
  );


  /*
    Copy WhatsApp invitation link
  */

  copyButton.addEventListener(
    "click",
    async function(){

      try{

        await navigator.clipboard.writeText(WA);

        copyButton.textContent =
          "COPIED";

        setTimeout(
          () =>
            copyButton.textContent =
            "COPY WHATSAPP LINK",
          1600
        );

      }

      catch(e){

        window.prompt(
          "Copy WhatsApp link:",
          WA
        );

      }

    }
  );


  /*
    Close fallback
  */

  closeButton.addEventListener(
    "click",
    function(){

      fallback.classList.remove("show");

    }
  );


  /*
    Keep the button text consistent
    when opened inside TikTok.
  */

  if(isTikTok){

    text.textContent =
      "JOIN WHATSAPP GROUP";

  }

})();
</script>

</body>
  </html>
