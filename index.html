<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JD Highlights | WhatsApp</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #061b12, #0b5d32);
      color: white;
      text-align: center;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 40px 25px;
      background: rgba(0,0,0,0.35);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
    }

    .subtitle {
      margin: 12px 0 30px;
      font-size: 16px;
      opacity: 0.9;
      line-height: 1.5;
    }

    .join {
      display: block;
      padding: 17px 20px;
      border-radius: 50px;
      background: #25D366;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(37,211,102,0.35);
    }

    .join:active {
      transform: scale(0.97);
    }

    .small {
      margin-top: 22px;
      font-size: 13px;
      opacity: 0.65;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">🏏</div>

    <h1>JD HIGHLIGHTS</h1>

    <p class="subtitle">
      Join our official WhatsApp group for the latest
      cricket highlights, updates and news.
    </p>

    <a
      class="join"
      href="https://chat.whatsapp.com/GSBuXahlqJ21uJvYHimiun?s=cl&p=a&mlu=4"
      target="_blank">
      🟢 JOIN WHATSAPP GROUP
    </a>

    <div class="small">
      Official JD Highlights Community
    </div>

  </div>

</body>
</html>
