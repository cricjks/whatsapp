<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="JD Store - Join our WhatsApp community.">

<title>JD Store</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --gold: #d9a83f;
    --gold-light: #ffe29a;
    --gold-dark: #8b5a12;
    --black: #030303;
    --panel: #0d0d0d;
    --text: #f5f5f5;
    --muted: #999;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 50% 20%, rgba(217,168,63,.12), transparent 35%),
        linear-gradient(145deg, #020202, #0b0b0b 50%, #020202);
    color: var(--text);
    overflow-x: hidden;
}

/* Main page */
.page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
}

.card {
    width: 100%;
    max-width: 470px;
    background: rgba(10,10,10,.94);
    border: 1px solid rgba(217,168,63,.35);
    border-radius: 28px;
    overflow: hidden;
    box-shadow:
        0 25px 80px rgba(0,0,0,.75),
        0 0 45px rgba(217,168,63,.08);
}

/* Hero */
.hero {
    position: relative;
    min-height: 540px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
    background: #000;
}

.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05) 25%,
            rgba(0,0,0,.15) 45%,
            rgba(0,0,0,.96) 100%
        );
    pointer-events: none;
}

.hero-image {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    filter: saturate(.95) contrast(1.05);
}

.hero-content {
    position: relative;
    z-index: 2;
    width: 100%;
    padding: 30px 24px 26px;
    text-align: center;
}

.logo {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--gold);
    box-shadow: 0 0 30px rgba(217,168,63,.3);
    margin-bottom: 14px;
}

.brand {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(34px, 10vw, 52px);
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--gold-light);
    text-shadow: 0 3px 20px rgba(0,0,0,.8);
}

.subtitle {
    margin-top: 8px;
    color: #d0d0d0;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* Content */
.content {
    padding: 25px 22px 28px;
}

.status {
    display: none;
    margin-bottom: 18px;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid rgba(217,168,63,.35);
    background: rgba(217,168,63,.07);
    color: #eee;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
}

.status strong {
    color: var(--gold-light);
}

/* Buttons */
.button {
    width: 100%;
    min-height: 58px;
    border: 0;
    border-radius: 16px;
    margin-top: 12px;
    padding: 15px 18px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .3px;
    cursor: pointer;
    transition:
        transform .15s ease,
        box-shadow .15s ease,
        opacity .15s ease;
}

.button:active {
    transform: scale(.98);
}

.button-primary {
    color: #090909;
    background: linear-gradient(
        135deg,
        #fff0b0,
        #d9a83f 45%,
        #f4c95d
    );
    box-shadow:
        0 10px 30px rgba(217,168,63,.18),
        inset 0 1px rgba(255,255,255,.65);
}

.button-secondary {
    color: var(--gold-light);
    background: #111;
    border: 1px solid rgba(217,168,63,.5);
}

.button-dark {
    color: #ddd;
    background: #080808;
    border: 1px solid #292929;
}

.button:hover {
    opacity: .94;
    box-shadow: 0 12px 35px rgba(0,0,0,.35);
}

/* TikTok panel */
.tiktok-panel {
    display: none;
    margin-top: 18px;
    padding: 20px;
    border-radius: 18px;
    background:
        linear-gradient(
            145deg,
            rgba(217,168,63,.11),
            rgba(255,255,255,.025)
        );
    border: 1px solid rgba(217,168,63,.28);
}

.tiktok-panel h2 {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--gold-light);
    font-size: 22px;
    margin-bottom: 9px;
    text-align: center;
}

.tiktok-panel p {
    color: #bdbdbd;
    font-size: 14px;
    line-height: 1.55;
    text-align: center;
}

/* Divider */
.divider {
    height: 1px;
    background: linear-gradient(
        to right,
        transparent,
        rgba(217,168,63,.35),
        transparent
    );
    margin: 23px 0;
}

/* Footer */
.footer {
    text-align: center;
    padding: 0 20px 25px;
    color: #666;
    font-size: 12px;
    letter-spacing: .5px;
}

/* Desktop */
@media (min-width: 700px) {
    .page {
        padding: 45px 20px;
    }

    .card {
        max-width: 520px;
    }

    .hero {
        min-height: 600px;
    }
}
</style>
</head>

<body>

<div class="page">

    <main class="card">

        <section class="hero">

            <!-- Your uploaded JD Store PNG -->
            <img
                src="jd-store.png"
                alt="JD Store"
                class="hero-image"
            >

            <div class="hero-content">

                <img
                    src="jd-store.png"
                    alt="JD Store"
                    class="logo"
                >

                <h1 class="brand">JD STORE</h1>

                <p class="subtitle">
                    Official WhatsApp Community
                </p>

            </div>

        </section>

        <section class="content">

            <!-- TikTok message -->
            <div id="tiktokPanel" class="tiktok-panel">

                <h2>OPEN JD STORE</h2>

                <p>
                    TikTok's browser may block WhatsApp.
                    Open this page in Chrome first, then WhatsApp
                    will open normally.
                </p>

                <button
                    class="button button-primary"
                    id="chromeButton"
                    type="button"
                >
                    OPEN IN CHROME
                </button>

                <button
                    class="button button-secondary"
                    id="copyButtonTikTok"
                    type="button"
                >
                    COPY WHATSAPP LINK
                </button>

            </div>

            <!-- Status message -->
            <div id="status" class="status"></div>

            <!-- Normal browser button -->
            <button
                class="button button-primary"
                id="joinButton"
                type="button"
            >
                JOIN JD STORE
            </button>

            <button
                class="button button-secondary"
                id="copyButton"
                type="button"
            >
                COPY WHATSAPP LINK
            </button>

            <div class="divider"></div>

            <button
                class="button button-dark"
                id="downloadButton"
                type="button"
            >
                DOWNLOAD WHATSAPP
            </button>

        </section>

        <div class="footer">
            © JD Store
        </div>

    </main>

</div>

<script>
/*
====================================================
JD STORE — WHATSAPP / TIKTOK FALLBACK
====================================================
*/

const WHATSAPP_LINK =
    "https://chat.whatsapp.com/GSBuXahlqJ21uJvYHimiun";

/*
Detect TikTok's in-app browser.

TikTok user agents commonly contain:
- TikTok
- Musically
*/

const userAgent = navigator.userAgent || navigator.vendor || "";

const isTikTok =
    /TikTok|Musically/i.test(userAgent);

/*
Detect other common in-app browsers.
*/

const isInstagram =
    /Instagram/i.test(userAgent);

const isFacebook =
    /FBAN|FBAV|FB_IAB/i.test(userAgent);

const isInAppBrowser =
    isTikTok || isInstagram || isFacebook;

/*
Elements
*/

const joinButton =
    document.getElementById("joinButton");

const copyButton =
    document.getElementById("copyButton");

const copyButtonTikTok =
    document.getElementById("copyButtonTikTok");

const chromeButton =
    document.getElementById("chromeButton");

const downloadButton =
    document.getElementById("downloadButton");

const tiktokPanel =
    document.getElementById("tiktokPanel");

const status =
    document.getElementById("status");

/*
Show message.
*/

function showStatus(message) {

    status.innerHTML = message;
    status.style.display = "block";

    setTimeout(function() {
        status.style.display = "none";
    }, 5000);
}

/*
Copy WhatsApp invite.
*/

async function copyWhatsAppLink(button) {

    try {

        if (navigator.clipboard &&
            navigator.clipboard.writeText) {

            await navigator.clipboard.writeText(
                WHATSAPP_LINK
            );

        } else {

            const textarea =
                document.createElement("textarea");

            textarea.value = WHATSAPP_LINK;

            textarea.style.position = "fixed";
            textarea.style.opacity = "0";

            document.body.appendChild(textarea);

            textarea.select();

            document.execCommand("copy");

            textarea.remove();
        }

        const original =
            button.innerText;

        button.innerText =
            "✓ LINK COPIED";

        showStatus(
            "<strong>WhatsApp link copied.</strong><br>" +
            "Open Chrome and paste the link."
        );

        setTimeout(function() {
            button.innerText = original;
        }, 2500);

    } catch (error) {

        showStatus(
            "<strong>Copy failed.</strong><br>" +
            "Please use the WhatsApp link manually."
        );
    }
}

/*
Open WhatsApp normally.

This is deliberately done only after
a user taps the button.
*/

function openWhatsApp() {

    window.location.href =
        WHATSAPP_LINK;
}

/*
Try to open Chrome directly on Android.

This uses an Android intent and therefore
works best when Chrome is installed.
*/

function openChrome() {

    const chromeIntent =
        "intent://chat.whatsapp.com/" +
        "GSBuXahlqJ21uJvYHimiun" +
        "#Intent;" +
        "scheme=https;" +
        "package=com.android.chrome;" +
        "end";

    /*
    User gesture -> Android intent.
    */

    window.location.href =
        chromeIntent;

    /*
    If the intent isn't supported,
    provide a visible fallback.
    */

    setTimeout(function() {

        showStatus(
            "<strong>Chrome didn't open?</strong><br>" +
            "Tap the ⋮ menu in TikTok and choose " +
            "<strong>Open in browser</strong>."
        );

    }, 1800);
}

/*
WhatsApp download page.
*/

function downloadWhatsApp() {

    window.open(
        "https://www.whatsapp.com/download",
        "_blank"
    );
}

/*
Normal JOIN button.
*/

joinButton.addEventListener(
    "click",
    function() {

        /*
        In TikTok we do NOT directly launch
        WhatsApp because TikTok may block it.
        */

        if (isInAppBrowser) {

            tiktokPanel.style.display =
                "block";

            showStatus(
                "<strong>TikTok browser detected.</strong><br>" +
                "Use OPEN IN CHROME above."
            );

            return;
        }

        openWhatsApp();
    }
);

/*
Copy buttons.
*/

copyButton.addEventListener(
    "click",
    function() {
        copyWhatsAppLink(copyButton);
    }
);

copyButtonTikTok.addEventListener(
    "click",
    function() {
        copyWhatsAppLink(copyButtonTikTok);
    }
);

/*
Chrome button.
*/

chromeButton.addEventListener(
    "click",
    openChrome
);

/*
Download button.
*/

downloadButton.addEventListener(
    "click",
    downloadWhatsApp
);

/*
When opened inside TikTok,
show the special fallback panel
immediately.

The normal JOIN button remains
available underneath.
*/

if (isInAppBrowser) {

    tiktokPanel.style.display =
        "block";

    /*
    Change the normal button text
    so users understand why they
    should use Chrome.
    */

    joinButton.innerText =
        "OPEN JD STORE IN BROWSER";

}

/*
If someone opens the page from
Chrome or another normal browser,
the TikTok panel stays hidden.
*/

</script>

</body>
  </html>
